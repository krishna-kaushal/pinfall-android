plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pinfall.rescue'
    compileSdk 36

    defaultConfig {
        applicationId 'com.pinfall.rescue'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
}
